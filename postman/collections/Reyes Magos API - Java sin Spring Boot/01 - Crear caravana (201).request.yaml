$kind: http-request
url: "{{baseUrl}}/api/caravanas"
method: POST
headers:
  Authorization: Bearer {{jefeToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "rey": "MELCHOR",
      "ofrenda": "ORO",
      "origen": "Persia",
      "camellos": 6
    }
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { const data = pm.response.json(); pm.collectionVariables.set('caravanaId', data.id); }
    language: text/javascript
order: 1000
